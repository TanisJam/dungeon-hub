# Stands in for Kong. The API and the test helpers address GoTrue through the
# gateway path Supabase exposes publicly (`/auth/v1/...`), while GoTrue itself
# serves those routes at the root. Kong does this rewrite in production; this
# does the same one thing and nothing else, so CI does not have to run Kong.
server {
  listen 8000;

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
