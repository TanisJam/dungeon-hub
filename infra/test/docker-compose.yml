# Minimal stack for the apps/api integration suite: Postgres + GoTrue, nothing else.
#
# The full self-hosted Supabase stack (infra/supabase, ~12 services) is what a
# developer runs day to day, but the integration tests only ever touch two things:
# the database, and GoTrue's admin + token endpoints via tests/helpers/test-user.ts.
# Kong, Storage, Realtime, Studio and the rest are dead weight in CI and are the
# services most likely to fail there for reasons unrelated to this codebase.
#
# GoTrue is pinned to the version production runs (v2.186.0) so the suite exercises
# the same auth behaviour the deployed API talks to.
#
# Ports are deliberately non-default (54322/54321) so this never collides with a
# developer's real Supabase stack on 5432/8000.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '54322:5432'
    volumes:
      - ./init-auth-schema.sql:/docker-entrypoint-initdb.d/00-auth-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 3s
      retries: 40

  auth:
    image: supabase/gotrue:v2.186.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?search_path=auth&sslmode=disable
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_JWT_SECRET: ${TEST_JWT_SECRET:?TEST_JWT_SECRET must be set — run scripts/test-stack.sh}
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_LOG_LEVEL: warn
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9999/health']
      interval: 2s
      timeout: 3s
      retries: 40

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      auth:
        condition: service_healthy
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '54321:8000'
    healthcheck:
      # 127.0.0.1, not localhost: /etc/hosts maps localhost to ::1 too, busybox wget
      # tries IPv6 first, and nginx listens only on IPv4 — so localhost here fails
      # with a connection refused that looks exactly like a dead gateway.
      # busybox wget also has no --spider; -O /dev/null is the portable form.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8000/auth/v1/health']
      interval: 2s
      timeout: 3s
      retries: 40
